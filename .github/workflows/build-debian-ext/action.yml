name: 'PHP Extension build action'
description: 'Build PHP extension for debian using docker'

runs:
  using: 'composite'
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # The image layers are cached by GitHub Actions, one cache per PHP version.
    - uses: docker/build-push-action@v6
      with:
        push: false
        load: true
        tags: builder:${{ matrix.php }}
        file: ./.github/workflows/build-debian-ext/Dockerfile
        build-args: |
          PHP_VERSION=${{ matrix.php }}
        cache-from: type=gha,scope=debian-php${{ matrix.php }}
        cache-to: type=gha,mode=max,scope=debian-php${{ matrix.php }}

    - name: Run the build process with Docker
      shell: bash
      run: docker run --rm -v "${{ github.workspace }}:/php-spx" -w /php-spx builder:${{ matrix.php }} sh -c 'phpize && ./configure && make -j"$(getconf _NPROCESSORS_ONLN)"'
